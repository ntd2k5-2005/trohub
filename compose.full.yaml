x-native: &native
  MONGODB_ENABLED: "true"
  MONGODB_URI: mongodb://mongodb:27017
  MONGODB_DATABASE: trohub
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "null"
  REDIS_CLIENT: predis
  CACHE_STORE: redis
  CASSANDRA_ENABLED: "true"
  CASSANDRA_HOST: cassandra
  CASSANDRA_PORT: 9042
  CASSANDRA_KEYSPACE: trohub
  CASSANDRA_USERNAME: ""
  CASSANDRA_PASSWORD: ""
  NEO4J_ENABLED: "true"
  NEO4J_HTTP_URI: http://neo4j:7474
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Missing graph password}
  MEILISEARCH_ENABLED: "true"
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: ${MEILISEARCH_KEY:?Missing index key}
  MEILISEARCH_INDEX: trohub_listings
services:
  app:
    environment: *native
    depends_on:
      native-init: {condition: service_completed_successfully}
  worker:
    environment: *native
  scheduler:
    environment: *native
  mongodb:
    image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    volumes: ["mongo-data:/data/db"]
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 25
  redis:
    image: redis:7.4-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 25
  cassandra:
    image: cassandra:5.0@sha256:7e2afd76d5afb991f64c5d9be7d1f8abf749e7ab0e9daaccfd6e865efcece7cc
    environment:
      CASSANDRA_CLUSTER_NAME: TroHubDelivery
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 192M
    volumes: ["cassandra-data:/var/lib/cassandra"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 90s
  neo4j:
    image: neo4j:5.26-community@sha256:ec10d705830a340c7438e125cb5c4f90522b85369d877c9a581c3de5974ab3d6
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s
  meilisearch:
    image: getmeili/meilisearch:v1.15@sha256:fe500cf9cca05cb9f027981583f28eccf17d35d94499c1f8b7b844e7418152fc
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
    volumes: ["meili-data:/meili_data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  native-init:
    image: trohub-delivery-app:local
    build: .
    env_file: .env
    environment:
      <<: *native
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: trohub
      DB_USERNAME: trohub
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: local
      APP_KEY: ""
    volumes: ["app-storage:/var/www/html/storage"]
    command: ["php", "docker/native-init.php"]
    depends_on:
      init: {condition: service_completed_successfully}
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
      cassandra: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
volumes:
  mongo-data:
  cassandra-data:
  neo4j-data:
  meili-data:
